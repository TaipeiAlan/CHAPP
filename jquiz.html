<!DOCTYPE html>
<html lang="zh-TW">
<head>
<script>
(function(){
  var ua = navigator.userAgent || '';
  var isIOS     = /iPhone|iPad|iPod/.test(ua);
  var isAndroid = /Android/.test(ua);
  var isLine    = /Line/i.test(ua);
  var isFB      = /FBAN|FBAV|Instagram|Twitter/i.test(ua);
  var isWeChat  = /MicroMessenger/i.test(ua);
  var isAndroidWV = isAndroid && /\bwv\b/.test(ua);
  var isIOSInApp  = isIOS && !/Safari/.test(ua) && /AppleWebKit/.test(ua);
  var inApp = isLine || isFB || isWeChat || isAndroidWV || isIOSInApp;
  if (!inApp) return;
  var url = location.href;
  if (isLine && isIOS && url.indexOf('openExternalBrowser=1') === -1) {
    location.replace(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'openExternalBrowser=1');
    return;
  }
  if (isAndroid && (isLine || isAndroidWV)) {
    var intentUrl = 'intent://' + url.replace(/^https?:\/\//, '')
      + '#Intent;scheme=' + (url.indexOf('https') === 0 ? 'https' : 'http')
      + ';action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end';
    location.href = intentUrl;
    setTimeout(showOverlay, 500);
    return;
  }
  document.addEventListener('DOMContentLoaded', showOverlay);
  function showOverlay() {
    if (document.getElementById('_inapp_overlay')) return;
    var appName = isLine ? 'LINE' : isWeChat ? 'WeChat' : isFB ? '社群應用' : 'App';
    var overlay = document.createElement('div');
    overlay.id = '_inapp_overlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.93);'
      + 'display:flex;flex-direction:column;align-items:center;justify-content:center;'
      + 'padding:32px;color:white;font-family:system-ui,-apple-system,sans-serif;';
    function el(tag, style, text) {
      var e = document.createElement(tag);
      if (style) e.style.cssText = style;
      if (text)  e.textContent = text;
      return e;
    }
    overlay.appendChild(el('div','font-size:2.5rem;margin-bottom:16px;','🌐'));
    overlay.appendChild(el('div','font-size:1.2rem;font-weight:800;margin-bottom:8px;text-align:center;','用瀏覽器開啟'));
    var sub = el('div','font-size:0.88rem;opacity:0.75;text-align:center;line-height:1.6;margin-bottom:28px;');
    sub.innerHTML = '此頁面在 ' + appName + ' 內功能受限<br>請改用 Safari / Chrome 開啟完整體驗';
    overlay.appendChild(sub);
    overlay.appendChild(el('div',
      'width:100%;padding:14px;border-radius:12px;background:rgba(255,255,255,0.08);'
      + 'border:1px solid rgba(255,255,255,0.15);margin-bottom:16px;font-size:0.78rem;'
      + 'color:#9ca3af;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;', url));
    var copyBtn = el('button',
      'width:100%;padding:14px;border-radius:12px;background:#7c3aed;color:white;'
      + 'border:none;font-size:1rem;font-weight:700;cursor:pointer;', '複製網址');
    copyBtn.addEventListener('click', function() {
      var succeed = function() {
        copyBtn.textContent = '✓ 已複製！';
        copyBtn.style.background = '#059669';
        setTimeout(function(){ copyBtn.textContent='複製網址'; copyBtn.style.background='#7c3aed'; }, 2500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(succeed).catch(fallbackCopy);
      } else { fallbackCopy(); }
      function fallbackCopy() {
        var t = document.createElement('textarea');
        t.value = url; t.style.position='fixed'; t.style.opacity='0';
        document.body.appendChild(t); t.focus(); t.select();
        try { if (document.execCommand('copy')) succeed(); } catch(e) {}
        document.body.removeChild(t);
      }
    });
    overlay.appendChild(copyBtn);
    overlay.appendChild(el('div','margin-top:18px;font-size:0.8rem;opacity:0.55;text-align:center;',
      '複製後貼到瀏覽器網址列開啟'));
    document.body.style.overflow = 'hidden';
    document.body.appendChild(overlay);
  }
})();
</script>

/* ---------- 工具 ---------- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nowTaipei() {
  const d = new Date();
  const t = new Date(d.getTime() + (d.getTimezoneOffset() + 480) * 60000);
  const p = function(n){ return String(n).padStart(2,'0'); };
  return t.getFullYear() + '-' + p(t.getMonth()+1) + '-' + p(t.getDate()) + ' ' + p(t.getHours()) + ':' + p(t.getMinutes());
}

/* ---------- 設定 ---------- */
const DEFAULT_SETTINGS = { scriptMode: 'hk', level: 'basic', direction: 'both', count: 20, optCount: 6 };
let quizSettings = loadSettings();
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (s && s.scriptMode) return Object.assign({}, DEFAULT_SETTINGS, s);
  } catch (e) {}
  return Object.assign({}, DEFAULT_SETTINGS);
}
function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(quizSettings)); }
function onSegClick(e) {
  const btn = e.currentTarget;
  const group = btn.parentElement.dataset.group;
  let val = btn.dataset.val;
  if (group === 'count') val = (val === 'all') ? 'all' : parseInt(val, 10);
  else if (group === 'optCount') val = parseInt(val, 10);
  quizSettings[group] = val;
  saveSettings();
  refreshSegActive();
}
function refreshSegActive() {
  document.querySelectorAll('.seg-group').forEach(function(g){
    const group = g.dataset.group;
    g.querySelectorAll('.seg-btn').forEach(function(b){
      const v = String(quizSettings[group]);
      b.classList.toggle('active', b.dataset.val === v);
    });
  });
}
function getScripts() { return quizSettings.scriptMode === 'hk' ? ['h','k'] : [quizSettings.scriptMode]; }
function getPool() {
  const levels = quizSettings.level === 'basic' ? ['basic']
               : quizSettings.level === 'dakuon' ? ['basic','dakuon']
               : ['basic','dakuon','yoon'];
  return KANA.filter(function(k){ return levels.indexOf(k.lv) >= 0; });
}

/* ---------- 出題 ---------- */

function pickDir() {
  if (quizSettings.direction === 'both') return Math.random() < 0.5 ? 'k2r' : 'r2k';
  return quizSettings.direction;
}
function pickScript() {
  const s = getScripts();
  return s.length > 1 ? (Math.random() < 0.5 ? 'h' : 'k') : s[0];
}
function genOptionsK2R(item, pool, count) {
  const need = (count || 4) - 1;
  const used = new Set([item.r]);
  const distract = [];
  const ordered = shuffle(pool.filter(p => p.row === item.row)).concat(
                  shuffle(pool.filter(p => p.col === item.col)),
                  shuffle(pool));
  for (const p of ordered) {
    if (distract.length >= need) break;
    if (used.has(p.r)) continue;
    used.add(p.r); distract.push(p.r);
  }
  return shuffle([item.r].concat(distract));
}
function genOptionsR2K(item, script, pool, count) {
  const need = (count || 4) - 1;
  const correctChar = item[script];
  const usedChar = new Set([correctChar]);
  const usedR = new Set([item.r]);   // 排除同羅馬音（如 じ/ぢ）避免雙正解
  const distract = [];
  const ordered = shuffle(pool.filter(p => p.row === item.row)).concat(
                  shuffle(pool.filter(p => p.col === item.col)),
                  shuffle(pool));
  for (const p of ordered) {
    if (distract.length >= need) break;
    if (usedR.has(p.r)) continue;
    const c = p[script];
    if (usedChar.has(c)) continue;
    usedChar.add(c); usedR.add(p.r); distract.push(c);
  }
  return shuffle([correctChar].concat(distract));
}
function makeQuestion(item, idx, pool, forced) {
  const dir = (forced && forced.dir) || pickDir();
  const script = (forced && forced.script) || pickScript();
  const optCount = quizSettings.optCount || 6;
  let prompt, correctAnswer, options, optClass;
  if (dir === 'k2r') {
    prompt = item[script];
    correctAnswer = item.r;
    options = genOptionsK2R(item, pool, optCount);
    optClass = '';
  } else {
    prompt = item.r;
    correctAnswer = item[script];
    options = genOptionsR2K(item, script, pool, optCount);
    optClass = 'kana';
  }
  return { idx: idx, qmode: 'kana', dir: dir, script: script, prompt: prompt, correctAnswer: correctAnswer,
           options: options, optClass: optClass, h: item.h, k: item.k, r: item.r, lv: item.lv };
}

// 取得目前設定下的出題方向清單
function getDirections() {
  return quizSettings.direction === 'both' ? ['k2r', 'r2k'] : [quizSettings.direction];
}
// 把每個假名依「腳本 × 方向」拆成獨立題目規格，使可出題數最多達基礎的 4 倍
function buildKanaSpecs(pool) {
  const scripts = getScripts();
  const dirs = getDirections();
  const specs = [];
  pool.forEach(function(item){
    scripts.forEach(function(sc){
      dirs.forEach(function(d){ specs.push({ item: item, script: sc, dir: d }); });
    });
  });
  return specs;
}

/* ---------- 單字出題 ---------- */
const VOCAB_DIRS = ['w2r', 'w2m', 'm2w'];   // 假名→羅馬音 / 假名→中文 / 中文→假名
function genVocabOptions(v, dir, count) {
  const need = (count || 4) - 1;
  const field = dir === 'w2r' ? 'r' : (dir === 'w2m' ? 'm' : 'w');
  const correct = v[field];
  const used = new Set([correct]);
  const distract = [];
  const ordered = shuffle(VOCAB.filter(p => p.cat === v.cat && p.w !== v.w)).concat(
                  shuffle(VOCAB.filter(p => p.w !== v.w)));
  for (const p of ordered) {
    if (distract.length >= need) break;
    if (used.has(p[field])) continue;
    used.add(p[field]); distract.push(p[field]);
  }
  return shuffle([correct].concat(distract));
}
function makeVocabQuestion(v, idx, forcedDir) {
  const dir = forcedDir || VOCAB_DIRS[Math.floor(Math.random() * VOCAB_DIRS.length)];
  const optCount = quizSettings.optCount || 6;
  let prompt, correctAnswer, optClass;
  if (dir === 'w2r') { prompt = v.w; correctAnswer = v.r; optClass = ''; }
  else if (dir === 'w2m') { prompt = v.w; correctAnswer = v.m; optClass = ''; }
  else { prompt = v.m; correctAnswer = v.w; optClass = 'kana'; }
  return { idx: idx, qmode: 'vocab', dir: dir, prompt: prompt, correctAnswer: correctAnswer,
           options: genVocabOptions(v, dir, optCount), optClass: optClass,
           w: v.w, r: v.r, m: v.m, cat: v.cat };
}

function startQuiz() {
  isWrongQuiz = false;
  const pool = getPool();
  const specs = buildKanaSpecs(pool);
  let n = quizSettings.count === 'all' ? specs.length : Math.min(quizSettings.count, specs.length);
  const chosen = shuffle(specs).slice(0, n);
  currentQuiz = chosen.map(function(s, i){ return makeQuestion(s.item, i, pool, { dir: s.dir, script: s.script }); });
  beginQuiz('五十音測驗');
}
function startVocabQuiz() {
  isWrongQuiz = false;
  let n = quizSettings.count === 'all' ? VOCAB.length : Math.min(quizSettings.count, VOCAB.length);
  const items = shuffle(VOCAB).slice(0, n);
  currentQuiz = items.map(function(v, i){ return makeVocabQuestion(v, i); });
  beginQuiz('常用單字測驗');
}
function startWrongQuiz() {
  const bank = getWrongBank();
  const keys = Object.keys(bank).sort(function(a, b){ return bank[b].wrongCount - bank[a].wrongCount; });
  if (!keys.length) return;
  const pool = KANA; // 干擾選項可取全部假名
  currentQuiz = keys.map(function(key, i){
    const w = bank[key];
    if (w.qmode === 'vocab') {
      const v = VOCAB.find(function(x){ return x.w === w.w; }) || { w:w.w, r:w.r, m:w.m, cat:w.cat };
      return makeVocabQuestion(v, i, w.dir);
    }
    const item = KANA.find(function(k){ return k.h === w.h; }) || { h:w.h, k:w.k, r:w.r, lv:w.lv, row:w.row, col:w.col };
    return makeQuestion(item, i, pool, { dir: w.dir, script: w.script });
  });
  isWrongQuiz = true;
  beginQuiz('錯題練習');
}
function beginQuiz(title) {
  userAnswers = {};
  quizStartedAt = Date.now();
  $('quiz-nav-title').textContent = title;
  renderQuiz();
  saveQuizSession();
  enterQuizHistory();
  showScreen('quiz-screen');
}
// 進入測驗時推入一筆歷史並改寫網址（?mode=1 一般測驗 / ?mode=2 錯題練習），
// 讓瀏覽器「上一頁」會回到本頁（jquiz）而非離站；離開仍會經 popstate 確認。
function enterQuizHistory() {
  quizActive = true;
  const mode = isWrongQuiz ? 2 : 1;
  try { history.pushState({ screen: 'quiz', mode: mode }, '', '?mode=' + mode); } catch (e) {}
}

/* ---------- 渲染 ---------- */
function renderQuiz() {
  const html = currentQuiz.map(renderCard).join('');
  $('quiz-cards').innerHTML = html;
  updateProgress();
}
function renderCard(q) {
  const i = q.idx;
  const ans = userAnswers[i];
  const skipped = ans === '';
  const answered = ans !== undefined && ans !== '';
  let dirBadge, scriptBadge, promptHtml, askText;
  if (q.qmode === 'vocab') {
    const vlabel = q.dir === 'w2r' ? '單字→羅馬音' : (q.dir === 'w2m' ? '單字→中文' : '中文→單字');
    dirBadge = '<span class="q-type-badge badge-vocab">' + vlabel + '</span>';
    scriptBadge = '<span class="q-type-badge badge-script">常用單字</span>';
    promptHtml = q.dir === 'm2w'
      ? '<div class="kana-prompt romaji">' + esc(q.prompt) + '</div>'
      : '<div class="kana-prompt big">' + esc(q.prompt) + '</div>';
    askText = q.dir === 'w2r' ? '請選出正確的羅馬拼音'
            : (q.dir === 'w2m' ? '請選出正確的中文意思' : '請選出正確的假名單字');
  } else {
    dirBadge = q.dir === 'k2r'
      ? '<span class="q-type-badge badge-k2r">假名→音</span>'
      : '<span class="q-type-badge badge-r2k">音→假名</span>';
    const sName = q.script === 'h' ? '平假名' : '片假名';
    scriptBadge = '<span class="q-type-badge badge-script">' + (q.dir === 'k2r' ? sName : '→' + sName) + '</span>';
    promptHtml = q.dir === 'k2r'
      ? '<div class="kana-prompt big">' + esc(q.prompt) + '</div>'
      : '<div class="kana-prompt romaji">' + esc(q.prompt) + '</div>';
    askText = q.dir === 'k2r' ? '請選出正確的羅馬拼音' : '請選出正確的' + sName;
  }
  const opts = q.options.map(function(opt){
    const sel = (ans === opt) ? ' selected' : '';
    return '<div class="opt-label' + sel + '" onclick="selectAnswer(' + i + ',' + JSON.stringify(opt).replace(/"/g,'&quot;') + ')">'
         + '<span class="opt-text ' + q.optClass + '">' + esc(opt) + '</span></div>';
  }).join('');
  return ''
    + '<div class="q-card' + (answered ? ' answered' : '') + (skipped ? ' skipped' : '') + '" id="qc-' + i + '">'
    +   '<div class="q-header">'
    +     '<span class="q-num">第 ' + (i+1) + ' 題</span>'
    +     '<div class="q-badges">' + dirBadge + scriptBadge + '</div>'
    +   '</div>'
    +   promptHtml
    +   '<div class="q-ask-row"><span class="q-ask">' + askText + '</span>'
    +     '<button class="btn-skip' + (skipped ? ' active' : '') + '" onclick="skipAnswer(' + i + ')">略過</button></div>'
    +   '<div class="options">' + opts + '</div>'
    + '</div>';
}
function selectAnswer(i, opt) {
  if (Date.now() - quizStartedAt < 250) return; // 防誤觸
  userAnswers[i] = opt;
  const card = $('qc-' + i);
  card.classList.remove('skipped', 'highlight-unanswered');
  card.classList.add('answered');
  card.querySelectorAll('.opt-label').forEach(function(el){
    el.classList.toggle('selected', el.querySelector('.opt-text').textContent === opt);
  });
  $('qc-' + i + '').querySelector('.btn-skip').classList.remove('active');
  updateProgress();
  saveQuizSession();
  // 自動捲到下一題未答
  const next = currentQuiz.find(function(q){ return userAnswers[q.idx] === undefined; });
  if (next) setTimeout(function(){ $('qc-' + next.idx).scrollIntoView({ behavior:'smooth', block:'start' }); }, 180);
}
function skipAnswer(i) {
  const card = $('qc-' + i);
  if (userAnswers[i] === '') { // 取消略過
    delete userAnswers[i];
    card.classList.remove('skipped');
    card.querySelector('.btn-skip').classList.remove('active');
  } else {
    userAnswers[i] = '';
    card.classList.remove('answered');
    card.classList.add('skipped');
    card.querySelectorAll('.opt-label').forEach(function(el){ el.classList.remove('selected'); });
    card.querySelector('.btn-skip').classList.add('active');
  }
  updateProgress();
  saveQuizSession();
}
function updateProgress() {
  const total = currentQuiz.length;
  let done = 0;
  currentQuiz.forEach(function(q){ if (userAnswers[q.idx] !== undefined) done++; });
  $('progress-inner').style.width = total ? (done / total * 100) + '%' : '0%';
  $('progress-count').textContent = done + ' / ' + total;
  $('submit-hint').textContent = done < total ? ('還有 ' + (total - done) + ' 題未作答') : '全部完成，可以送出囉！';
}

/* ---------- 批改 ---------- */
function submitQuiz() {
  const firstUnanswered = currentQuiz.find(function(q){ return userAnswers[q.idx] === undefined; });
  if (firstUnanswered) {
    const card = $('qc-' + firstUnanswered.idx);
    card.classList.add('highlight-unanswered');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(function(){ card.classList.remove('highlight-unanswered'); }, 2600);
    return;
  }
  let score = 0;
  const entries = currentQuiz.map(function(q){
    const ua = userAnswers[q.idx];
    const correct = ua !== '' && ua === q.correctAnswer;
    if (correct) score++;
    return { qmode: q.qmode, dir: q.dir, script: q.script, prompt: q.prompt, correctAnswer: q.correctAnswer,
             userAnswer: ua, correct: correct, h: q.h, k: q.k, r: q.r, lv: q.lv,
             w: q.w, m: q.m, cat: q.cat };
  });
  const record = { date: nowTaipei(), score: score, total: currentQuiz.length,
                   settings: Object.assign({}, quizSettings), wrongQuiz: isWrongQuiz, entries: entries };
  saveRecord(record);
  saveWrongBank(entries);
  sessionStorage.removeItem(SESSION_KEY);
  lastRecord = record;
  quizActive = false;
  // 批改完成，清掉網址上的 ?mode 參數（避免上一頁又回到測驗）
  try { history.replaceState({ screen: 'results' }, '', location.pathname); } catch (e) {}
  showResults(record);
}

function scoreMessage(pct) {
  if (pct === 100) return '🎉 完美！全部答對！';
  if (pct >= 90) return '👏 非常棒！';
  if (pct >= 70) return '😊 不錯，繼續加油！';
  if (pct >= 50) return '💪 還需要多練習';
  return '📚 多複習五十音吧！';
}
function showResults(record) {
  const pct = Math.round(record.score / record.total * 100);
  const grid = record.entries.map(function(e, i){
    const cls = e.correct ? 'grid-correct' : (e.userAnswer === '' ? 'grid-skip' : 'grid-wrong');
    const icon = e.correct ? '✓' : (e.userAnswer === '' ? '–' : '✗');
    return '<div class="ans-cell ' + cls + '" onclick="jumpToResult(' + i + ')">'
         + '<span class="cell-num">' + (i+1) + '</span><span class="cell-icon">' + icon + '</span></div>';
  }).join('');
  $('score-card').innerHTML = ''
    + '<div class="score-ring"><span class="score-num">' + record.score + '</span>'
    + '<span class="score-denom">/ ' + record.total + '</span></div>'
    + '<div class="score-message">' + scoreMessage(pct) + '</div>'
    + '<div class="score-date">' + esc(record.date) + ' ・ ' + pct + '%</div>'
    + '<div class="answer-grid">' + grid + '</div>';
  showAllResults = false;
  $('toggle-result-btn').textContent = '▾ 顯示全部題目';
  renderResultDetails(record);
  showScreen('results-screen');
}
function renderResultDetails(record) {
  const html = record.entries.map(function(e, i){
    if (!showAllResults && e.correct) return '';
    return buildResultCard(e, i);
  }).join('');
  $('result-details').innerHTML = html || '<div class="card" style="text-align:center;color:#9ca3af;">全部答對，沒有需要訂正的題目 🎉</div>';
}
function buildResultCard(e, i) {
  const badge = e.correct ? '<div class="res-badge correct">✓</div>'
              : (e.userAnswer === '' ? '<div class="res-badge skipped">–</div>' : '<div class="res-badge wrong">✗</div>');
  const dirLabel = e.qmode === 'vocab'
    ? (e.dir === 'w2r' ? '單字 → 羅馬音' : (e.dir === 'w2m' ? '單字 → 中文' : '中文 → 單字'))
    : (e.dir === 'k2r' ? '假名 → 羅馬音' : '羅馬音 → 假名');
  let body = '<div class="res-prompt">' + esc(e.prompt) + '<span class="res-sub">' + dirLabel + '</span></div>';
  if (e.correct) {
    body += '<div class="res-line"><span class="res-correct-ans">' + esc(e.correctAnswer) + '</span> ✓</div>';
  } else if (e.userAnswer === '') {
    body += '<div class="res-skip-note">已略過</div>';
    body += '<div class="res-line">正解：<span class="res-correct-ans">' + esc(e.correctAnswer) + '</span></div>';
  } else {
    body += '<div class="res-line">你的答案：<span class="res-your-ans">' + esc(e.userAnswer) + '</span></div>';
    body += '<div class="res-line">正解：<span class="res-correct-ans">' + esc(e.correctAnswer) + '</span></div>';
  }
  // 補充：完整對照
  const ref = e.qmode === 'vocab'
    ? esc(e.w) + ' ・ ' + esc(e.r) + ' ・ ' + esc(e.m)
    : esc(e.h) + ' ・ ' + esc(e.k) + ' ・ ' + esc(e.r);
  body += '<div class="res-line" style="color:#9ca3af;font-size:0.8rem;margin-top:8px;">' + ref + '</div>';
  return '<div class="res-card" id="res-' + i + '">' + badge + body + '</div>';
}
function toggleResultView() {
  showAllResults = !showAllResults;
  $('toggle-result-btn').textContent = showAllResults ? '▴ 只看錯題' : '▾ 顯示全部題目';
  renderResultDetails(lastRecord);
}
function jumpToResult(i) {
  if (!showAllResults) { toggleResultView(); }
  setTimeout(function(){
    const el = $('res-' + i);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 60);
}

/* ---------- 紀錄 ---------- */
function getRecords() { try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || []; } catch (e) { return []; } }
function saveRecord(record) {
  const recs = getRecords();
  recs.unshift(record);
  if (recs.length > 50) recs.length = 50;
  localStorage.setItem(RECORDS_KEY, JSON.stringify(recs));
}

/* ---------- 錯題庫 ---------- */
function getWrongBank() { try { return JSON.parse(localStorage.getItem(WRONG_KEY)) || {}; } catch (e) { return {}; } }
function saveWrongBank(entries) {
  const bank = getWrongBank();
  entries.forEach(function(e){
    const key = e.qmode === 'vocab' ? ('vocab:' + e.dir + ':' + e.w) : (e.script + ':' + e.dir + ':' + e.h);
    if (e.correct) {
      // 答對則從錯題庫移除
      if (bank[key]) delete bank[key];
    } else if (bank[key]) {
      bank[key].wrongCount++;
      bank[key].lastWrong = nowTaipei();
      bank[key].lastUserAnswer = e.userAnswer;
    } else if (e.qmode === 'vocab') {
      bank[key] = { qmode: 'vocab', w: e.w, r: e.r, m: e.m, cat: e.cat, dir: e.dir,
                    wrongCount: 1, firstWrong: nowTaipei(), lastWrong: nowTaipei(), lastUserAnswer: e.userAnswer };
    } else {
      const item = KANA.find(function(k){ return k.h === e.h; }) || {};
      bank[key] = { qmode: 'kana', h: e.h, k: e.k, r: e.r, lv: e.lv, row: item.row || '', col: item.col || '',
                    dir: e.dir, script: e.script, wrongCount: 1,
                    firstWrong: nowTaipei(), lastWrong: nowTaipei(), lastUserAnswer: e.userAnswer };
    }
  });
  localStorage.setItem(WRONG_KEY, JSON.stringify(bank));
}

/* ---------- session 續答 ---------- */
function saveQuizSession() {
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({
    currentQuiz: currentQuiz, userAnswers: userAnswers, isWrongQuiz: isWrongQuiz,
    title: $('quiz-nav-title').textContent, savedAt: nowTaipei()
  }));
}
function getSession() { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch (e) { return null; } }
function resumeQuiz() {
  const s = getSession();
  if (!s || !s.currentQuiz || !s.currentQuiz.length) return;
  currentQuiz = s.currentQuiz;
  userAnswers = s.userAnswers || {};
  isWrongQuiz = !!s.isWrongQuiz;
  quizStartedAt = Date.now();
  $('quiz-nav-title').textContent = s.title || '測驗中';
  renderQuiz();
  enterQuizHistory();
  showScreen('quiz-screen');
}
// 測驗中的「← 返回」走瀏覽器上一頁，交由 popstate 統一處理離開確認
function confirmQuitQuiz() { history.back(); }

/* ---------- 畫面切換 ---------- */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}
function showHome() {
  quizActive = false;
  refreshSegActive();
  renderHomeStats();
  renderResumeBanner();
  renderWbHome();
  showScreen('home-screen');
}
function renderHomeStats() {
  const recs = getRecords();
  const box = $('home-stats');
  if (!recs.length) { box.innerHTML = '<div class="stat-date">尚無測驗紀錄，開始第一輪吧！</div>'; return; }
  const count = recs.length;
  const avg = Math.round(recs.reduce(function(s,r){ return s + r.score / r.total * 100; }, 0) / count);
  const best = Math.max.apply(null, recs.map(function(r){ return Math.round(r.score / r.total * 100); }));
  box.innerHTML = ''
    + '<div class="stats-grid">'
    + '<div class="stat-box"><div class="stat-num">' + count + '</div><div class="stat-lbl">測驗次數</div></div>'
    + '<div class="stat-box"><div class="stat-num">' + avg + '%</div><div class="stat-lbl">平均分</div></div>'
    + '<div class="stat-box"><div class="stat-num">' + best + '%</div><div class="stat-lbl">最高分</div></div>'
    + '</div>'
    + '<div class="stat-date">上次測驗：' + esc(recs[0].date) + '</div>';
}
function renderWbHome() {
  const n = Object.keys(getWrongBank()).length;
  $('home-wb-count').textContent = n;
  $('home-wb-btn').disabled = n === 0;
}
function renderResumeBanner() {
  const s = getSession();
  const banner = $('resume-banner');
  if (s && s.currentQuiz && s.currentQuiz.length) {
    let done = 0;
    (s.currentQuiz).forEach(function(q){ if ((s.userAnswers || {})[q.idx] !== undefined) done++; });
    if (done >= s.currentQuiz.length) { banner.innerHTML = ''; return; }
    banner.innerHTML = '<div class="resume-card"><div class="resume-info"><strong>有未完成的測驗</strong>'
      + esc(s.title || '') + ' ・ ' + done + ' / ' + s.currentQuiz.length + ' 題</div>'
      + '<div class="resume-btns"><button class="btn-resume btn-resume-go" onclick="resumeQuiz()">繼續</button>'
      + '<button class="btn-resume btn-resume-disc" onclick="discardSession()">放棄</button></div></div>';
  } else { banner.innerHTML = ''; }
}
function discardSession() { sessionStorage.removeItem(SESSION_KEY); renderResumeBanner(); }

/* ---------- 歷史 ---------- */
function showHistory() {
  const recs = getRecords();
  const list = $('history-list');
  if (!recs.length) {
    list.innerHTML = '<div class="history-empty">尚無測驗紀錄 📭</div>';
    $('history-clear').innerHTML = '';
  } else {
    list.innerHTML = recs.map(function(r){
      const pct = Math.round(r.score / r.total * 100);
      const color = pct >= 80 ? '#10b981' : pct >= 50 ? '#f59e0b' : '#ef4444';
      const tag = r.wrongQuiz ? ' ・ 錯題練習' : '';
      return '<div class="history-item"><div><div class="history-date">' + esc(r.date) + '</div>'
        + '<div class="history-meta">' + r.total + ' 題' + tag + '</div>'
        + '<div class="history-bar"><div class="history-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div></div>'
        + '<div><div class="history-score">' + r.score + '/' + r.total + '</div>'
        + '<div class="history-pct">' + pct + '%</div></div></div>';
    }).join('');
    $('history-clear').innerHTML = '<button class="btn btn-danger" onclick="clearHistory()">清除全部紀錄</button>';
  }
  showScreen('history-screen');
}
function clearHistory() {
  if (confirm('確定要清除所有歷史紀錄嗎？此動作無法復原。')) {
    localStorage.removeItem(RECORDS_KEY);
    showHistory();
  }
}

/* ---------- 錯題庫畫面 ---------- */
function showWrongBank() {
  const bank = getWrongBank();
  const keys = Object.keys(bank).sort(function(a, b){ return bank[b].wrongCount - bank[a].wrongCount; });
  const c = $('wb-content');
  if (!keys.length) {
    c.innerHTML = '<div class="wb-empty"><div class="wb-empty-icon">🎉</div>目前沒有錯題，繼續保持！</div>';
  } else {
    const totalWrong = keys.reduce(function(s, k){ return s + bank[k].wrongCount; }, 0);
    const cards = keys.map(function(k){
      const w = bank[k];
      let mainKana, romaji, dirLabel, sub;
      if (w.qmode === 'vocab') {
        mainKana = w.w; romaji = w.r;
        dirLabel = w.dir === 'w2r' ? '單字→音' : (w.dir === 'w2m' ? '單字→中文' : '中文→單字');
        sub = w.m + ' ・ ' + w.cat;
      } else {
        mainKana = w.script === 'k' ? w.k : w.h; romaji = w.r;
        dirLabel = w.dir === 'k2r' ? '假名→音' : '音→假名';
        sub = w.h + ' / ' + w.k;
      }
      return '<div class="wb-card"><div class="wb-kana">' + esc(mainKana) + '</div>'
        + '<div class="wb-info"><span class="wb-romaji">' + esc(romaji) + '</span>'
        + '<div class="wb-meta"><span>' + dirLabel + '</span><span>' + esc(sub) + '</span>'
        + '<span>上次：' + esc(w.lastWrong || '') + '</span></div></div>'
        + '<div class="wb-count-badge"><span class="badge-num">' + w.wrongCount + '</span>錯</div></div>';
    }).join('');
    c.innerHTML = ''
      + '<div class="wb-stats-bar"><div class="wb-stat"><div class="wb-stat-num">' + keys.length + '</div><div class="wb-stat-lbl">錯題數</div></div>'
      + '<div class="wb-stat"><div class="wb-stat-num">' + totalWrong + '</div><div class="wb-stat-lbl">累計答錯</div></div>'
      + '<button class="btn btn-primary" onclick="startWrongQuiz()">開始練習錯題 ✏️</button></div>'
      + cards
      + '<div class="wb-footer"><button class="btn btn-danger" onclick="clearWrongBank()">清除錯題庫</button></div>';
  }
  showScreen('wrong-bank-screen');
}
function clearWrongBank() {
  if (confirm('確定要清除整個錯題庫嗎？')) { localStorage.removeItem(WRONG_KEY); showWrongBank(); }
}

/* ---------- 題庫儀表板（點選才顯示）---------- */
function showDashboard() {
  const basic = KANA.filter(function(k){ return k.lv === 'basic'; }).length;
  const dakuon = KANA.filter(function(k){ return k.lv === 'dakuon'; }).length;
  const yoon = KANA.filter(function(k){ return k.lv === 'yoon'; }).length;
  // 依目前設定可出題數（拆假名變體後）
  const specs = buildKanaSpecs(getPool());
  const scriptName = quizSettings.scriptMode === 'hk' ? '平+片假名' : (quizSettings.scriptMode === 'h' ? '平假名' : '片假名');
  const levelName = quizSettings.level === 'basic' ? '基本' : (quizSettings.level === 'dakuon' ? '清濁' : '清濁拗');
  const dirName = quizSettings.direction === 'both' ? '雙向' : (quizSettings.direction === 'k2r' ? '假名→音' : '音→假名');
  // 單字分類統計
  const cats = {};
  VOCAB.forEach(function(v){ cats[v.cat] = (cats[v.cat] || 0) + 1; });
  const catRows = Object.keys(cats).map(function(c){
    return '<div class="dash-row"><span class="dash-k">' + esc(c) + '</span><span class="dash-v">' + cats[c] + '</span></div>';
  }).join('');
  // 學習紀錄
  const recs = getRecords();
  const wbCount = Object.keys(getWrongBank()).length;

  $('dashboard-content').innerHTML = ''
    + '<div class="dash-card"><div class="dash-title">五十音題庫</div>'
    +   '<div class="dash-grid">'
    +     '<div class="dash-box"><div class="dash-num">' + basic + '</div><div class="dash-lbl">清音</div></div>'
    +     '<div class="dash-box"><div class="dash-num">' + dakuon + '</div><div class="dash-lbl">濁音/半濁</div></div>'
    +     '<div class="dash-box"><div class="dash-num">' + yoon + '</div><div class="dash-lbl">拗音</div></div>'
    +     '<div class="dash-box"><div class="dash-num">' + KANA.length + '</div><div class="dash-lbl">合計</div></div>'
    +   '</div>'
    +   '<div class="dash-note">目前設定：' + scriptName + ' ・ ' + levelName + ' ・ ' + dirName + '<br>'
    +   '可出題數（拆假名變體後）：<b style="color:#4f46e5;">' + specs.length + '</b> 題</div>'
    + '</div>'
    + '<div class="dash-card"><div class="dash-title">常用單字題庫</div>'
    +   '<div class="dash-grid">'
    +     '<div class="dash-box amber"><div class="dash-num">' + VOCAB.length + '</div><div class="dash-lbl">單字總數</div></div>'
    +     '<div class="dash-box amber"><div class="dash-num">' + Object.keys(cats).length + '</div><div class="dash-lbl">主題分類</div></div>'
    +     '<div class="dash-box amber"><div class="dash-num">' + (VOCAB.length * 3) + '</div><div class="dash-lbl">可出題數</div></div>'
    +   '</div>'
    +   '<div style="margin-top:12px;">' + catRows + '</div>'
    + '</div>'
    + '<div class="dash-card"><div class="dash-title">學習紀錄</div>'
    +   '<div class="dash-grid">'
    +     '<div class="dash-box"><div class="dash-num">' + recs.length + '</div><div class="dash-lbl">測驗次數</div></div>'
    +     '<div class="dash-box"><div class="dash-num">' + wbCount + '</div><div class="dash-lbl">錯題數</div></div>'
    +   '</div>'
    + '</div>';
  showScreen('dashboard-screen');
}

/* ---------- 上一頁 / 離開保護 ---------- */
// 作答中按「上一頁」：攔截 popstate，確認後回到首頁；取消則重新推入測驗狀態留在原地。
window.addEventListener('popstate', function(e) {
  if (quizActive) {
    if (confirm('離開測驗？進度會保留，可從首頁繼續。')) {
      showHome();   // quizActive 在此被設為 false
    } else {
      const mode = isWrongQuiz ? 2 : 1;
      try { history.pushState({ screen: 'quiz', mode: mode }, '', '?mode=' + mode); } catch (err) {}
    }
  } else {
    // 非作答中（結果頁/其他）：回首頁
    showHome();
  }
});
// 作答中嘗試重新整理或關閉分頁時提示（進度已存於 session，可續答）
window.addEventListener('beforeunload', function(e) {
  if (quizActive) { e.preventDefault(); e.returnValue = ''; return ''; }
});

/* ---------- 啟動 ---------- */
(function init() {
  // 若以帶 ?mode 參數的網址直接載入（例如作答中重整），清掉參數並回到首頁，
  // 由「續答」橫幅提供繼續入口（無法僅憑網址還原題目）。
  if (location.search) {
    try { history.replaceState({}, '', location.pathname); } catch (e) {}
  }
  refreshSegActive();
  renderHomeStats();
  renderResumeBanner();
  renderWbHome();
})();
</script>
</body>
</html>
